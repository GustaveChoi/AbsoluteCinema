<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campus Cinema · 校园影院购票</title>
<link rel="stylesheet" href="/cinema.css">
<header class="student-header">
  <div class="brand"><b>◉</b>Campus Cinema</div>
  <div class="tag">校园影院 · 学生购票</div>
  <div class="student-session">
    <span class="pill">● 模拟支付</span>
    <span id="studentName"></span>
    <button id="studentLogout" type="button">退出登录</button>
  </div>
</header>
<div class="shell"><aside><nav><button class="active" data-page="booking">选片 · 购票</button><button data-page="orders">我的订单</button></nav></aside><main>
<section id="booking"><div class="top"><div><div class="eyebrow">NOW SHOWING</div><h1>把今晚，留给一场电影。</h1><p>选择电影与场次，体验从选座到订单的完整流程。</p></div></div><div class="grid" id="movies"></div><div id="bookingArea" class="seatlayout hidden"><div class="card"><div class="top"><h2 id="showTitle"></h2><select id="show" style="width:auto"></select></div><div class="screen">SCREEN / 银幕</div><div class="seats" id="seats"></div><div class="legend"><span>□ 可选</span><span style="color:var(--lime)">■ 已选</span><span>▧ 已占用</span></div></div><div class="card"><div class="eyebrow">YOUR TICKET</div><h2 style="margin-top:15px">选座确认</h2><p id="ticketInfo">请选择座位（可多选）</p><div class="price" id="price"></div><p class="small">可一次选择多个座位 · 提交后一起锁座<br>请在 15 分钟内支付，也可主动取消</p><button class="primary" id="buy" disabled style="width:100%">提交购票订单 →</button></div></div></section>
<section id="orders" class="hidden"><div class="eyebrow">ORDER CENTER</div><h1>每一次相遇，都有记录。</h1><div class="top"><p>查看你的订单，支付或取消待支付订单，也可以退还已支付的单张票。</p><button id="refreshOrders">刷新订单</button></div><div class="card scroll" id="orderList"></div></section>
</main></div><div id="toast" class="hidden" role="status"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data,toastTimer;
function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),5000)}
async function api(url,body){let r=await fetch(url,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});let d=await r.json();if(r.status===401)location.reload();if(!r.ok)throw Error(d.error||'操作失败');return d}
function guard(fn){return async(...a)=>{try{await fn(...a)}catch(e){toast(e.message)}}}
const selected = new Map();
let seatRequest = 0, orderRequest = 0, booking = false;
async function page(id){document.querySelectorAll('main>section').forEach(e=>e.classList.toggle('hidden',e.id!==id));document.querySelectorAll('nav button').forEach(e=>e.classList.toggle('active',e.dataset.page===id));if(id==='orders')await orders();else if(!$('#bookingArea').classList.contains('hidden'))await seats();}
document.querySelectorAll('nav button').forEach(b=>b.onclick=guard(()=>page(b.dataset.page)));
async function refresh(){data=await api('/api/data');$('#studentName').textContent=data.username;$('#movies').innerHTML=data.movies.map((m,i)=>`<article class="card movie"><div class="poster p${i%3}"><strong>${esc(m.title)}</strong></div><div class="body"><div class="top" style="margin:8px 0"><h3>${esc(m.title)}</h3><span class="pill">${esc(m.genre)}</span></div><div class="meta">${m.duration} 分钟 · 校园特别放映</div><p>${esc(m.description)}</p><button class="primary" onclick="selectMovie(${m.id})" ${data.screenings.some(s=>s.movie_id===m.id)?'':'disabled'}>选择场次与座位 →</button></div></article>`).join('');}
const selectMovie=guard(async id=>{let m=data.movies.find(m=>m.id===id);$('#showTitle').textContent=m.title;$('#show').innerHTML=data.screenings.filter(s=>s.movie_id===id).map(s=>`<option value="${s.id}">${esc(s.starts_at)}</option>`).join('');$('#bookingArea').classList.remove('hidden');await seats();$('#bookingArea').scrollIntoView({behavior:'smooth',block:'center'})});
function renderSelection(show) {
  $('#ticketInfo').textContent = selected.size
    ? show.starts_at + ' · ' + [...selected.values()].join('、')
    : '请选择座位（可多选）';
  $('#price').textContent = '合计 ¥ ' + (show.price * selected.size / 100).toFixed(2);
  $('#buy').disabled = booking || !selected.size;
}
async function seats() {
  const request = ++seatRequest;
  const show = data.screenings.find(s => s.id == $('#show').value);
  selected.clear();
  renderSelection(show);
  $('#seats').replaceChildren();
  const list = await api('/api/seats?screening=' + show.id);
  if (request !== seatRequest) return;
  $('#seats').innerHTML = list.map(x => `<button class="seat ${x.order_id ? 'sold' : ''}" ${x.order_id ? 'disabled' : ''} aria-pressed="false" data-id="${x.id}" title="${x.row_no}排${x.col_no}座">${String.fromCharCode(64+x.row_no)}${x.col_no}</button>`).join('');
  document.querySelectorAll('.seat:not(:disabled)').forEach(button => {
    button.onclick = () => {
      if (booking) return;
      const id = Number(button.dataset.id);
      const chosen = !selected.has(id);
      if (chosen) selected.set(id, button.title);
      else selected.delete(id);
      button.classList.toggle('chosen', chosen);
      button.setAttribute('aria-pressed', chosen);
      renderSelection(show);
    };
  });
}
$('#show').onchange = guard(seats);
$('#buy').onclick = guard(async () => {
  if (booking || !selected.size) return;
  const chosen = [...selected.keys()];
  booking = true;
  $('#studentLogout').disabled = true;
  $('#buy').disabled = true;
  try {
    await api('/api/book', {screening:+$('#show').value, seats:chosen});
    toast('已锁定 ' + chosen.length + ' 个座位');
  } catch (error) {
    await seats();
    throw error;
  } finally {
    booking = false;
    $('#studentLogout').disabled = false;
  }
  await seats();
  await page('orders');
});
function table(head,body){return `<table><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${body.length?body.map(row=>'<tr>'+row.map(x=>`<td>${x}</td>`).join('')+'</tr>').join(''):`<tr><td colspan="${head.length}">暂无记录</td></tr>`}</tbody></table>`}
const orderStatus = {pending:'待支付', paid:'已支付', cancelled:'已取消', refunded:'已退款'};
function orderActions(order) {
  const {id, status, booking_id: batch} = order;
  if (status === 'pending' && (!batch || batch === id)) {
    return `<div class="actions"><button onclick="changeOrder(${id},'paid')">${batch ? '整单模拟支付' : '模拟支付'}</button><button onclick="changeOrder(${id},'cancelled')">${batch ? '整单取消' : '取消'}</button></div>`;
  }
  if (status === 'paid') return `<button onclick="changeOrder(${id},'refunded')">退票</button>`;
  if (status === 'refunded') return `退款 #${order.refund_id} · ¥${(order.refund_amount / 100).toFixed(2)}`;
  return '—';
}
async function orders() {
  const request = ++orderRequest;
  const list = await api('/api/orders');
  if (request !== orderRequest) return;
  $('#orderList').innerHTML = table(['票号 / 购票单','用户 / 影片','场次 / 座位','金额','状态','操作'], list.map(o => [
    '#' + o.id + (o.booking_id ? '<br>购票单 #' + o.booking_id : ''),
    esc(o.name) + ' / ' + esc(o.title),
    esc(o.starts_at) + '<br>' + esc(o.hall) + ' · ' + o.row_no + '排' + o.col_no + '座',
    '¥' + (o.amount / 100).toFixed(2), orderStatus[o.status], orderActions(o)
  ]));
}
const changeOrder = guard(async (id, status) => {
  if (status === 'refunded' && !window.confirm('确定退还这张票并释放座位？')) return;
  await api('/api/order', {id, status});
  toast({paid:'支付成功', cancelled:'订单已取消，座位已释放', refunded:'模拟退款成功，座位已释放'}[status]);
  await orders();
  if (!$('#bookingArea').classList.contains('hidden')) await seats();
});
$('#refreshOrders').onclick = guard(orders);
$('#studentLogout').onclick = guard(async () => {
  await api('/api/student/logout', {});
  location.reload();
});
guard(refresh)();
</script></html>
