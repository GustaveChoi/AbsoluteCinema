<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campus Cinema · 校园影院购票</title>
<link rel="stylesheet" href="/cinema.css">
<header><div class="brand"><b>◉</b>Campus Cinema</div><div class="tag">校园影院 · 学生购票</div><span class="pill">● 模拟支付</span></header>
<div class="shell"><aside><nav><button class="active" data-page="booking">选片 · 购票</button><button data-page="orders">我的订单</button></nav></aside><main>
<section id="booking"><div class="top"><div><div class="eyebrow">NOW SHOWING</div><h1>把今晚，留给一场电影。</h1><p>选择电影与场次，体验从选座到订单的完整流程。</p></div><div style="width:150px"><label>模拟当前用户</label><select id="user"></select></div></div><div class="grid" id="movies"></div><div id="bookingArea" class="seatlayout hidden"><div class="card"><div class="top"><h2 id="showTitle"></h2><select id="show" style="width:auto"></select></div><button id="refreshSeats" type="button">刷新座位</button><div class="screen">SCREEN / 银幕</div><div class="seats" id="seats"></div><div class="legend"><span>□ 可选</span><span style="color:var(--lime)">■ 已选</span><span>▧ 已占用</span></div></div><div class="card"><div class="eyebrow">YOUR TICKET</div><h2 style="margin-top:15px">选座确认</h2><p id="ticketInfo">请选择一个座位</p><div class="price" id="price"></div><p class="small">每单一座 · 提交后保留座位<br>请在 15 分钟内支付，也可主动取消</p><button class="primary" id="buy" disabled style="width:100%">提交购票订单 →</button></div></div></section>
<section id="orders" class="hidden"><div class="eyebrow">ORDER CENTER</div><h1>每一次相遇，都有记录。</h1><div class="top"><p>查看当前模拟用户的订单，支付或取消待支付订单。</p><button id="refreshOrders">刷新订单</button></div><div class="card scroll" id="orderList"></div></section>
</main></div><div id="toast" class="hidden" role="status"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data,toastTimer;
function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),5000)}
async function api(url,body){let r=await fetch(url,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});let d=await r.json();if(!r.ok)throw Error(d.error||'操作失败');return d}
function guard(fn){return async(...a)=>{try{await fn(...a)}catch(e){toast(e.message)}}}
let selected=null;
async function page(id){document.querySelectorAll('main>section').forEach(e=>e.classList.toggle('hidden',e.id!==id));document.querySelectorAll('nav button').forEach(e=>e.classList.toggle('active',e.dataset.page===id));if(id==='orders')await orders();else if(!$('#bookingArea').classList.contains('hidden'))await seats();}
document.querySelectorAll('nav button').forEach(b=>b.onclick=guard(()=>page(b.dataset.page)));
async function refresh(){data=await api('/api/data');let user=$('#user').value||'1';$('#user').innerHTML=data.users.map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('');$('#user').value=user;$('#movies').innerHTML=data.movies.map((m,i)=>`<article class="card movie"><div class="poster p${i%3}"><strong>${esc(m.title)}</strong></div><div class="body"><div class="top" style="margin:8px 0"><h3>${esc(m.title)}</h3><span class="pill">${esc(m.genre)}</span></div><div class="meta">${m.duration} 分钟 · 校园特别放映</div><p>${esc(m.description)}</p><button class="primary" onclick="selectMovie(${m.id})" ${data.screenings.some(s=>s.movie_id===m.id)?'':'disabled'}>选择场次与座位 →</button></div></article>`).join('');}
const selectMovie=guard(async id=>{let m=data.movies.find(m=>m.id===id);$('#showTitle').textContent=m.title;$('#show').innerHTML=data.screenings.filter(s=>s.movie_id===id).map(s=>`<option value="${s.id}">${esc(s.starts_at)}</option>`).join('');$('#bookingArea').classList.remove('hidden');await seats();$('#bookingArea').scrollIntoView({behavior:'smooth',block:'center'})});
async function seats(){selected=null;$('#buy').disabled=true;$('#ticketInfo').textContent='请选择一个座位';let s=data.screenings.find(s=>s.id==$('#show').value);$('#price').textContent='¥ '+(s.price/100).toFixed(2);let list=await api('/api/seats?screening='+s.id);$('#seats').innerHTML=list.map(x=>`<button class="seat ${x.order_id?'sold':''}" ${x.order_id?'disabled':''} data-id="${x.id}" title="${x.row_no}排${x.col_no}座">${String.fromCharCode(64+x.row_no)}${x.col_no}</button>`).join('');document.querySelectorAll('.seat:not(:disabled)').forEach(b=>b.onclick=()=>{selected=+b.dataset.id;document.querySelectorAll('.seat').forEach(e=>e.classList.remove('chosen'));b.classList.add('chosen');$('#ticketInfo').textContent=s.starts_at+' · '+b.title;$('#buy').disabled=false})}
$('#show').onchange=guard(seats);$('#refreshSeats').onclick=guard(seats);$('#buy').onclick=guard(async()=>{let seat=selected;$('#buy').disabled=true;try{let r=await api('/api/book',{user:+$('#user').value,screening:+$('#show').value,seat});toast('订单 #'+r.id+' 创建成功');await seats();await page('orders')}catch(e){await seats();throw e}});
function table(head,body){return `<table><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${body.length?body.map(row=>'<tr>'+row.map(x=>`<td>${x}</td>`).join('')+'</tr>').join(''):`<tr><td colspan="${head.length}">暂无记录</td></tr>`}</tbody></table>`}
async function orders(){let list=await api('/api/orders?user='+$('#user').value);$('#orderList').innerHTML=table(['订单','用户 / 影片','场次 / 座位','金额','状态','操作'],list.map(o=>['#'+o.id,esc(o.name)+' / '+esc(o.title),esc(o.starts_at)+'<br>'+esc(o.hall)+' · '+o.row_no+'排'+o.col_no+'座','¥'+(o.amount/100).toFixed(2),({pending:'待支付',paid:'已支付',cancelled:'已取消'})[o.status],o.status==='pending'?`<div class="actions"><button onclick="changeOrder(${o.id},${o.user_id},'paid')">模拟支付</button><button onclick="changeOrder(${o.id},${o.user_id},'cancelled')">取消</button></div>`:'—']))}
const changeOrder=guard(async(id,user,status)=>{await api('/api/order',{id,user,status});toast(status==='paid'?'支付成功':'订单已取消，座位已释放');await orders();if(!$('#bookingArea').classList.contains('hidden'))await seats()});$('#refreshOrders').onclick=guard(orders);$('#user').onchange=guard(async()=>{if(!$('#orders').classList.contains('hidden'))await orders()});
guard(refresh)();
</script></html>
